<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>
    <!-- Participants modal (hidden by default) -->
    <div id="participants-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-overlay" id="modal-overlay"></div>
      <div class="modal-content">
        <header class="modal-header">
          <h3 id="modal-title" class="modal-title">Participants</h3>
          <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>
        </header>
        <section class="modal-body" id="modal-body">
          <!-- Participant list injected here -->
        </section>
        <footer class="modal-footer">
          <button id="modal-close-bottom" class="button">Close</button>
        </footer>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
